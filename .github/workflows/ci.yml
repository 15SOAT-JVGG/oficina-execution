name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.8
        ports: ['4566:4566']
        env:
          SERVICES: dynamodb
    env:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build, testes e cobertura
        run: mvn -B verify
      - name: SonarCloud e quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "Secret SONAR_TOKEN ausente" >&2; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "Variável SONAR_PROJECT_KEY ausente" >&2; exit 1; }
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=15soat-jvgg -Dsonar.qualitygate.wait=true
